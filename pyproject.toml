[project]
name = "video-factory"
version = "0.1.0"
description = "Tạo nhiều phiên bản video từ 5 engine rồi chọn bản để đăng"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "edge-tts==7.3.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "diagrams>=0.25.1",
    "playwright>=1.63.0",
    "faster-whisper==1.2.1",
    # faster-whisper 1.2.1 passes metadata_errors, removed in PyAV 19.
    "av>=11,<19",
]

[tool.uv]
package = false
