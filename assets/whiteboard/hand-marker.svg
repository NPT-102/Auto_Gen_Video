<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <!-- Bàn tay phải cầm bút dạ kiểu ba ngón (ngón cái, trỏ, giữa), nhìn từ phía trước bảng. Đầu bút ở (60, 60):
       tools/whiteboard_hand.py xuất PNG trong suốt và ghi toạ độ đầu bút để đặt đúng vào điểm đang vẽ.
       Bút nghiêng 30°, tựa vào hổ khẩu, đuôi bút nhô lên trên các khớp ngón; cẳng tay nghiêng 56°. -->
  <defs>
    <linearGradient id="skin" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f9dfc8"/>
      <stop offset="0.55" stop-color="#f0c4a2"/>
      <stop offset="1" stop-color="#dfa47f"/>
    </linearGradient>
    <linearGradient id="finger" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#eebd99"/>
      <stop offset="1" stop-color="#f8d9c0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4ab87"/>
      <stop offset="1" stop-color="#cf9068"/>
    </linearGradient>
    <linearGradient id="nail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3ee"/>
      <stop offset="1" stop-color="#f0c2b4"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58636f"/>
      <stop offset="0.35" stop-color="#313842"/>
      <stop offset="1" stop-color="#14171b"/>
    </linearGradient>
    <linearGradient id="cuff" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde3ec"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5175a8"/>
      <stop offset="1" stop-color="#34557f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="18" dy="24" stdDeviation="16" flood-color="#3a2a1c" flood-opacity=".18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <g filter="url(#shadow)" stroke-linejoin="round" stroke-linecap="round">
    <!-- tay áo + cổ áo sơ mi, chạy ra ngoài khung về phía dưới bên phải -->
    <g transform="translate(452 486) rotate(56)">
      <path d="M 60 -122 L 760 -150 L 760 150 L 60 122 Z" fill="url(#sleeve)" stroke="#243c5e" stroke-width="4"/>
      <path d="M 160 -120 C 180 -40 180 40 160 120" fill="none" stroke="#2c4870" stroke-width="3" opacity=".55"/>
      <path d="M -6 -112 L 72 -118 C 84 -40 84 40 72 118 L -6 112 C -18 40 -18 -40 -6 -112 Z"
            fill="url(#cuff)" stroke="#8f9aab" stroke-width="4"/>
      <circle cx="44" cy="84" r="8" fill="#f3f5f9" stroke="#8f9aab" stroke-width="3"/>
      <path d="M -112 -88 C -72 -98 -38 -100 -6 -98 L -6 98 C -40 102 -78 100 -116 92 Z" fill="url(#shade)" stroke="#9a6244" stroke-width="4"/>
    </g>

    <!-- ngón út và ngón áp út co dưới lòng bàn tay -->
    <path d="M 238 336 C 206 348 196 386 214 410 C 232 432 266 426 280 404" fill="url(#shade)" stroke="#9a6244" stroke-width="4"/>
    <path d="M 270 398 C 242 418 242 456 266 474 C 290 490 326 478 332 452" fill="url(#shade)" stroke="#9a6244" stroke-width="4"/>
    <path d="M 226 390 C 236 395 248 395 256 388" fill="none" stroke="#b9774f" stroke-width="3"/>
    <path d="M 270 450 C 280 456 292 456 300 450" fill="none" stroke="#b9774f" stroke-width="3"/>

    <!-- mu bàn tay: mép trên nằm ngay dưới thân bút -->
    <path d="M 232 268 C 252 236 300 228 350 240 C 416 256 478 288 496 340 C 512 392 482 452 420 476
             C 366 496 304 486 272 452 C 238 416 214 310 232 268 Z" fill="url(#skin)" stroke="#9a6244" stroke-width="4"/>
    <path d="M 360 296 C 378 330 384 368 378 404" fill="none" stroke="#d6a07c" stroke-width="3.5"/>
    <path d="M 410 306 C 430 340 436 376 428 410" fill="none" stroke="#d6a07c" stroke-width="3.5"/>
    <path d="M 452 326 C 466 354 468 386 458 414" fill="none" stroke="#d6a07c" stroke-width="3.5"/>
    <ellipse cx="404" cy="290" rx="18" ry="11" transform="rotate(25 404 290)" fill="#fbe6d6" opacity=".75"/>
    <ellipse cx="452" cy="314" rx="15" ry="9" transform="rotate(35 452 314)" fill="#fbe6d6" opacity=".6"/>

    <!-- bút dạ: tựa vào hổ khẩu giữa ngón cái và ngón trỏ, đuôi bút nhô lên trên mu bàn tay -->
    <g transform="translate(60 60) rotate(30)">
      <path d="M 58 -19 L 414 -21 C 438 -21 454 -14 456 0 C 454 14 438 21 414 21 L 58 19 Z"
            fill="url(#body)" stroke="#0c0e11" stroke-width="3.5"/>
      <path d="M 72 -10 L 408 -12" stroke="#9aa5b5" stroke-width="5" opacity=".7"/>
      <path d="M 320 -21 L 338 -21 L 338 21 L 320 21 Z" fill="#e8663a" stroke="#0c0e11" stroke-width="3"/>
      <path d="M 414 -21 C 438 -21 454 -14 456 0 C 454 14 438 21 414 21 Z" fill="#e8663a" stroke="#0c0e11" stroke-width="3.5"/>
      <path d="M 26 -13 C 38 -17 48 -19 58 -19 L 58 19 C 48 19 38 17 26 13 Z" fill="#d9dee5" stroke="#0c0e11" stroke-width="3.5"/>
      <path d="M 1 0 L 27 -10 L 27 10 Z" fill="#1b1e22" stroke="#0c0e11" stroke-width="3"/>
    </g>
    <!-- bóng của bút đổ lên mu bàn tay -->
    <path d="M 270 250 C 320 262 360 284 392 304" fill="none" stroke="#b87a56" stroke-width="12" opacity=".28" filter="url(#soft)"/>

    <!-- ngón giữa đỡ bút từ dưới: chỉ lộ đầu ngón -->
    <path d="M 250 300 C 222 290 196 262 186 236 C 180 220 192 208 206 216 C 228 228 256 256 270 280"
          fill="url(#shade)" stroke="#9a6244" stroke-width="4"/>
    <path d="M 190 226 C 188 218 194 213 200 215" fill="none" stroke="#e7b9a9" stroke-width="5"/>

    <!-- ngón cái: từ gốc bàn tay vươn lên, ép bút từ phía dưới -->
    <path d="M 262 340 C 236 314 206 254 190 206 C 182 182 196 166 214 174 C 236 184 262 228 286 266
             C 304 296 296 352 262 340 Z" fill="url(#finger)" stroke="#9a6244" stroke-width="4"/>
    <path d="M 196 186 C 197 176 206 172 213 177 C 221 184 222 196 215 203 C 208 208 198 200 196 186 Z"
          fill="url(#nail)" stroke="#c98d78" stroke-width="2.5"/>
    <path d="M 238 244 C 246 252 248 264 244 272" fill="none" stroke="#c98a64" stroke-width="3"/>

    <!-- ngón trỏ đặt dọc trên thân bút, đầu ngón ấn gần đầu bút -->
    <path d="M 334 236 C 290 222 228 196 182 170 C 154 156 150 130 172 124 C 206 114 246 120 282 140 C 306 154 328 168 344 182
             C 374 198 370 248 334 236 Z" fill="url(#finger)" stroke="#9a6244" stroke-width="4"/>
    <path d="M 164 138 C 165 127 175 122 185 125 C 194 130 196 142 189 149 C 181 154 167 150 164 138 Z"
          fill="url(#nail)" stroke="#c98d78" stroke-width="2.5"/>
    <path d="M 238 154 C 246 164 248 176 242 186" fill="none" stroke="#c98a64" stroke-width="3"/>
    <path d="M 290 176 C 298 186 300 198 294 208" fill="none" stroke="#c98a64" stroke-width="3"/>
    <path d="M 194 128 C 222 124 252 132 282 148" fill="none" stroke="#fdeee2" stroke-width="5" opacity=".8"/>
  </g>
</svg>
